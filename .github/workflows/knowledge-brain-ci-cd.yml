name: knowledge-brain CI/CD

on:
  push:
    branches: [main]
    paths:
      - "knowledge-brain/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: knowledge-brain

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowledge_brain
          POSTGRES_PASSWORD: knowledge_brain
          POSTGRES_DB: knowledge_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Enable pgvector extension
        run: PGPASSWORD=knowledge_brain psql -h localhost -U knowledge_brain -d knowledge_brain_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://knowledge_brain:knowledge_brain@localhost:5432/knowledge_brain_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          OPENAI_API_KEY: test-key
          VOYAGE_API_KEY: test-key
          MCP_API_KEY: test-key
          AZURE_LANGUAGE_ENDPOINT: https://test.cognitiveservices.azure.com/
          AZURE_LANGUAGE_KEY: test-key
        run: uv run pytest

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build image (explicit amd64 — GitHub's runner is amd64 natively,
          but this stays explicit on purpose, not implicit)
        run: |
          docker build --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/knowledge-brain-backend:${{ github.sha }} .

      - name: Push image
        run: docker push ${{ vars.ACR_LOGIN_SERVER }}/knowledge-brain-backend:${{ github.sha }}

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ${{ vars.CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/knowledge-brain-backend:${{ github.sha }} \
            --revision-suffix ${{ github.sha }}

      - name: Smoke test
        run: |
          sleep 15
          curl -f ${{ vars.BACKEND_URL }}/docs
