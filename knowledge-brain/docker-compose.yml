services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-brain-postgres
    environment:
      POSTGRES_USER: knowledge_brain
      POSTGRES_PASSWORD: knowledge_brain
      POSTGRES_DB: knowledge_brain
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: knowledge-brain-neo4j
    environment:
      NEO4J_AUTH: neo4j/knowledge_brain
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: knowledge-brain-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: knowledge-brain-azurite
    # Only the blob service is used (document file storage) — queue and
    # table emulation aren't started, since nothing in this project needs
    # them. --loose relaxes some strict real-Azure validation Azurite does
    # by default, which otherwise rejects a few things real Blob Storage
    # actually accepts.
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  azurite_data:
