[project]
name = "knowledge-brain"
version = "0.1.0"
description = "Enterprise RAG platform for asking questions over internal documents"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "azure-ai-textanalytics>=5.4.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.10",
    "langsmith>=0.10.15",
    "mcp>=2.0.0",
    "neo4j>=6.2.0",
    "openai>=2.52.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
